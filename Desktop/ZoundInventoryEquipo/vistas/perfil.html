<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoundInventory - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <div class="row g-0">

        <div class="col-md-3 col-lg-2">
            <nav class="sidebar p-3">
                <div class="sidebar-wrapper">
                    <div>
                        <h4 class="text-music fw-bold text-center mb-4 mt-2">ZoundInventory</h4>
                        <ul class="nav flex-column gap-2">
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="dashboard.html">Inicio</a>
                            </li>
                            <li class="nav-item"><a
                                    class="nav-link text-white fw-bold bg-secondary bg-opacity-25 rounded p-2"
                                    href="perfil.html">Mi Perfil</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2"
                                    href="proveedores.html">Proveedores</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="alertas.html">Alertas
                                    Stock</a></li>
                        </ul>
                    </div>
                    <div class="mb-3">
                        <a class="nav-link text-danger p-2 fw-bold text-center border border-danger border-opacity-25 rounded bg-danger bg-opacity-10"
                            href="../index.html">Cerrar Sesión</a>
                    </div>
                </div>
            </nav>
        </div>

        <div class="col-md-9 col-lg-10 offset-md-3 offset-lg-2">
            <main class="main-content-fluid">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
                    <h1 class="h2 fw-bold">Información de la Cuenta</h1>
                    <span class="badge bg-music-dark p-2 border border-secondary text-white">Datos de Usuario</span>
                </div>

                <div class="card card-custom p-4">
                    <form id="perfilForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold">Primer Nombre</label>
                                <input type="text" class="form-control" value="David" readonly required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold">Primer Apellido</label>
                                <input type="text" class="form-control" value="Vergara" readonly required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold">Documento de Identidad</label>
                                <input type="text" class="form-control" value="1023456789" readonly disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold">Cargo / Rol</label>
                                <input type="text" class="form-control" value="Administrador de Inventario" readonly
                                    disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold">Correo Electrónico</label>
                                <input type="email" class="form-control" value="dvergara@zoundinventory.com" readonly
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold">Teléfono Corporativo</label>
                                <input type="text" class="form-control" value="+57 300 123 4567" readonly required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4 pt-2 border-top border-secondary">
                            <button type="button" id="btnEditar" class="btn btn-music px-4 py-2">Modificar
                                Datos</button>
                            <button type="submit" id="btnGuardar" class="btn btn-success px-4 py-2 d-none">Guardar
                                Cambios</button>
                            <button type="button" id="btnCancelar"
                                class="btn btn-outline-light px-4 py-2 d-none">Cancelar</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
