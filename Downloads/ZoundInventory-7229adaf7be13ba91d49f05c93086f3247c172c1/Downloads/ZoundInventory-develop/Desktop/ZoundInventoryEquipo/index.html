<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoundInventory - Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="d-flex align-items-center justify-content-center vh-100 bg-music-dark">

    <div class="container">
        <div class="row justify-content-center w-100 g-0">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-music m-0">ZoundInventory</h1>
                    <p class="text-muted small mt-1">Sistema de Control de Hardware y Periféricos</p>
                </div>

                <div class="card card-custom p-4">

                    <ul class="nav nav-tabs border-secondary mb-4 justify-content-center" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-white fw-bold bg-transparent border-0" id="login-tab"
                                data-bs-toggle="tab" data-bs-target="#loginPanel" type="button"
                                role="tab">Ingresar</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-white-50 bg-transparent border-0" id="register-tab"
                                data-bs-toggle="tab" data-bs-target="#registerPanel" type="button"
                                role="tab">Registrarse</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabsContent">

                        <div class="tab-pane fade show active" id="loginPanel" role="tabpanel">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label text-white-50 small fw-bold">Correo Electrónico</label>
                                    <input type="email" id="email" class="form-control" required
                                        autocomplete="username">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-white-50 small fw-bold">Contraseña</label>
                                    <input type="password" id="password" class="form-control" required
                                        autocomplete="current-password">
                                </div>
                                <button type="submit" class="btn btn-music w-100 py-2 fw-bold">Iniciar Sesión</button>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="registerPanel" role="tabpanel">
                            <form id="registroForm">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-white-50 small fw-bold">Primer Nombre</label>
                                        <input type="text" id="regNombre" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-white-50 small fw-bold">Primer Apellido</label>
                                        <input type="text" id="regApellido" class="form-control" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-white-50 small fw-bold">Correo Electrónico</label>
                                    <input type="email" id="regEmail" class="form-control" required
                                        autocomplete="username">
                                </div>
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label text-white-50 small fw-bold">Contraseña</label>
                                        <input type="password" id="regPassword" class="form-control" required
                                            autocomplete="new-password">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-white-50 small fw-bold">Confirmar
                                            Contraseña</label>
                                        <input type="password" id="regConfirmPassword" class="form-control" required
                                            autocomplete="new-password">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-music w-100 py-2 fw-bold">Crear Cuenta</button>
                            </form>
                        </div>

                    </div>

                </div>

                <div class="text-center mt-3">
                    <p class="text-muted small m-0">Estación de Trabajo Local</p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
