<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoundInventory - Formulario de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2">
             <nav class="sidebar p-3">
                <div class="sidebar-wrapper">
                    <!-- Mismo menú lateral -->
                    <div>
                        <h4 class="text-music fw-bold text-center mb-4 mt-2">ZoundInventory</h4>
                        <ul class="nav flex-column gap-2">
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="dashboard.html">Inicio</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="perfil.html">Mi Perfil</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="proveedores.html">Proveedores</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="alertas.html">Alertas Stock</a></li>
                            <li class="nav-item"><a class="nav-link text-white fw-bold bg-secondary bg-opacity-25 rounded p-2" href="./actualizarproducto.html">Actualizar Producto</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="./agregarproductos.html">Agregar Producto</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="./crud.html">CRUD</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="./movimientos.html">Importadores</a></li>
                            <li class="nav-item"><a class="nav-link text-white-50 p-2" href="./productos.html">Productos</a></li>
                        </ul>
                    </div>
                    <div class="mb-3">
                        <a class="nav-link text-danger p-2 fw-bold text-center border border-danger border-opacity-25 rounded bg-danger bg-opacity-10" href="../index.html">Cerrar Sesión</a>
                    </div>
                </div>
            </nav>
        </div>

        <div class="col-md-9 col-lg-10 offset-md-3 offset-lg-2">
            <main class="main-content-fluid">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom border-secondary">
                    <h1 class="h2 fw-bold">Gestión de Productos</h1>
                    <span class="badge bg-music-dark p-2 border border-secondary text-white">Rol: Administrador</span>
                </div>

                <div class="card card-custom p-4">
                    <h4 id="form-titulo" class="fw-bold mb-4 text-music">Añadir / Actualizar Producto</h4>
                    <form id="form-producto">
                        <input type="hidden" id="producto-id">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold" for="nombre">Nombre del Producto</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" id="nombre" required placeholder="Ej. Teclado Mecánico RGB">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold" for="categoria">Categoría</label>
                                <select class="form-select bg-dark text-white border-secondary" id="categoria" required>
                                    <option value="">Seleccione una categoría...</option>
                                    <option value="Monitores">Monitores</option>
                                    <option value="Teclados">Teclados y Ratones</option>
                                    <option value="Componentes">Componentes Internos</option>
                                    <option value="Almacenamiento">Almacenamiento</option>
                                    <option value="Redes">Redes y Conectividad</option>
                                    <option value="Audio">Equipos de Audio</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold" for="precio">Precio</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="precio" step="0.01" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold" for="stock">Stock Inicial / Disponible</label>
                                <input type="number" class="form-control bg-dark text-white border-secondary" id="stock" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4 pt-2 border-top border-secondary">
                            <button type="submit" class="btn btn-music px-4 py-2">Guardar Producto</button>
                            <button type="button" class="btn btn-outline-light px-4 py-2" id="btn-cancelar" style="display:none;">Cancelar</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
