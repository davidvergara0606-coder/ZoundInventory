<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZoundInventory - Productos</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <div class="contenedor-principal">
        <main class="contenido-crud">
            <h1>Gestión de Productos </h1>

            <section class="formulario-section">
                <h2 id="form-titulo">Actualizar Producto</h2>
                <form id="form-producto">
                    <input type="hidden" id="producto-id">

                    <div class="form-group">
                        <label for="nombre">Nombre del Producto:</label>
                        <input type="text" id="nombre" required placeholder="Ej. Teclado Mecánico RGB">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" required>
                            <option value="">Seleccione una categoría...</option>
                            <option value="Cat1">Categoría 1 (Reemplazar)</option>
                            <option value="Cat2">Categoría 2 (Reemplazar)</option>
                            <option value="Cat3">Categoría 3 (Reemplazar)</option>
                            <option value="Cat4">Categoría 4 (Reemplazar)</option>
                            <option value="Cat5">Categoría 5 (Reemplazar)</option>
                            <option value="Cat6">Categoría 6 (Reemplazar)</option>
                            <option value="Cat7">Categoría 7 (Reemplazar)</option>
                            <option value="Cat8">Categoría 8 (Reemplazar)</option>
                            <option value="Cat9">Categoría 9 (Reemplazar)</option>
                            <option value="Cat10">Categoría 10 (Reemplazar)</option>
                            <option value="Cat11">Categoría 11 (Reemplazar)</option>
                            <option value="Cat12">Categoría 12 (Reemplazar)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio:</label>
                        <input type="number" id="precio" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Disponible:</label>
                        <input type="number" id="stock" required>
                    </div>

                    <button type="submit" class="btn-guardar">Guardar</button>
                    <button type="button" class="btn-cancelar" id="btn-cancelar" style="display:none;">Cancelar</button>
                </form>
            </section>
            <hr>
        </main>
    </div>

    <script src="../js/productos.js"></script>
</body>

</html>
